name: Publish setup site

on:
  push:
    branches: [main]
    paths:
      - 'tools/setup/**'
      - 'tools/site/**'
      - 'tools/build_site.py'
      - 'docs/**'
      - 'tests/wizard.test.js'
      - 'tests/export_fixtures.js'
      - 'tests/test_generated_configs.py'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'tools/setup/**'
      - 'tools/site/**'
      - 'tools/build_site.py'
      - 'docs/**'
      - 'tests/wizard.test.js'
      - 'tests/export_fixtures.js'
      - 'tests/test_generated_configs.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r tools/site/requirements.txt
      - run: node --test tests/calculator.test.js tests/wizard.test.js
      - name: Build site and check links
        run: python tools/build_site.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  validate-yaml:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: tdr-wizard-esphome-2026.8.2
      - run: python -m pip install esphome==2026.8.2
      - name: Validate all exports and compile the weighed import
        run: python tests/test_generated_configs.py --compile

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build, validate-yaml]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
