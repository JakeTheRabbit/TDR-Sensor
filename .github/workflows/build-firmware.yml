name: Build firmware
on:
  push:
    branches: [main]
    paths: ['esphome/**', '.github/workflows/build-firmware.yml']
  pull_request:
    paths: ['esphome/**', '.github/workflows/build-firmware.yml']
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: [atom-lite, atom-s3, atom-poe, m5-dial, esp32-generic]
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.board }}
        id: build
        uses: esphome/build-action@v7
        with:
          yaml-file: esphome/factory/tdr-sensor-${{ matrix.board }}-factory.yaml
          version: '2026.8.2'
          complete-manifest: true
      - name: Stage firmware
        env:
          BUILD_NAME: ${{ steps.build.outputs.name }}
          BOARD: ${{ matrix.board }}
        run: |
          mkdir -p dist
          cp "$BUILD_NAME/firmware.factory.bin" "dist/tdr-sensor-$BOARD.factory.bin"
          if [ -f "$BUILD_NAME/firmware.ota.bin" ]; then
            cp "$BUILD_NAME/firmware.ota.bin" "dist/tdr-sensor-$BOARD.ota.bin"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: tdr-sensor-${{ matrix.board }}
          path: dist
          retention-days: 30
  release:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
