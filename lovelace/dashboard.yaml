# Replace tdr_sensor with the actual entity prefix after checking the entity registry.
title: TDR Sensor
views:
  - title: Substrate
    path: substrate
    icon: mdi:water-percent
    cards:
      - type: entities
        title: Measurement quality
        entities:
          - binary_sensor.tdr_sensor_vwc_ready
          - binary_sensor.tdr_sensor_sensor_data_fresh
          - sensor.tdr_sensor_calibration_status
          - sensor.tdr_sensor_raw_sample_age
      - type: entities
        title: Root-zone observations
        entities:
          - sensor.tdr_sensor_vwc
          - sensor.tdr_sensor_wet_reference_index
          - sensor.tdr_sensor_bulk_ec_25c
          - sensor.tdr_sensor_temperature
          - sensor.tdr_sensor_water_trend
          - sensor.tdr_sensor_dryback
          - sensor.tdr_sensor_dryback_percent
          - sensor.tdr_sensor_detected_wettings_today
          - sensor.tdr_sensor_last_detected_rise
      - type: history-graph
        title: Checked VWC
        hours_to_show: 48
        entities:
          - sensor.tdr_sensor_vwc
          - sensor.tdr_sensor_peak_vwc
          - sensor.tdr_sensor_trough_vwc
      - type: history-graph
        title: Bulk EC at 25 C
        hours_to_show: 48
        entities:
          - sensor.tdr_sensor_bulk_ec_25c
  - title: Calibration
    path: calibration
    icon: mdi:tune
    cards:
      - type: markdown
        content: >-
          Save a wet reference for an index. For actual VWC, capture weighed A/B
          and a separately weighed C check. Follow the repository calibration
          guide; an index of 100 is not 100% VWC.
      - type: entities
        title: Prepare and capture
        entities:
          - select.tdr_sensor_substrate_profile
          - switch.tdr_sensor_calibration_mode
          - binary_sensor.tdr_sensor_capture_ready
          - sensor.tdr_sensor_capture_raw_average
          - sensor.tdr_sensor_capture_raw_spread
          - button.tdr_sensor_save_wet_reference
          - number.tdr_sensor_weighed_reference_vwc
          - button.tdr_sensor_capture_weighed_point_a
          - button.tdr_sensor_capture_weighed_point_b
          - button.tdr_sensor_check_independent_weighed_point_c
          - sensor.tdr_sensor_third_point_error
          - sensor.tdr_sensor_last_calibration_action
      - type: entities
        title: Saved references
        entities:
          - sensor.tdr_sensor_saved_wet_raw
          - sensor.tdr_sensor_saved_a_raw
          - sensor.tdr_sensor_saved_a_vwc
          - sensor.tdr_sensor_saved_b_raw
          - sensor.tdr_sensor_saved_b_vwc
          - sensor.tdr_sensor_saved_check_raw
          - sensor.tdr_sensor_saved_check_vwc
