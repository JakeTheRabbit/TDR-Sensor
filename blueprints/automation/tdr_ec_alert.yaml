blueprint:
  name: TDR EC observation alert
  description: >-
    Alert on operator-defined EC bounds. Bulk EC 25C is the default measured
    quantity to consider; feed, runoff and modelled pore EC have different
    meanings. Establish suitable bounds for the selected measurement first.
  domain: automation
  source_url: https://github.com/JakeTheRabbit/TDR-Sensor/blob/main/blueprints/automation/tdr_ec_alert.yaml
  input:
    ec_sensor:
      name: EC measurement
      selector:
        entity:
          filter: {domain: sensor}
    high_limit:
      name: High bound (dS/m)
      selector:
        number: {min: 0.01, max: 30, step: 0.01, mode: box}
    low_limit:
      name: Low bound (dS/m)
      selector:
        number: {min: 0, max: 30, step: 0.01, mode: box}
    notify_action:
      name: Notification action
      description: The message variable is available to custom notification actions.
      default:
        - action: persistent_notification.create
          data:
            title: TDR EC observation
            message: '{{ message }}'
      selector: {action: {}}
mode: single
variables:
  ec_entity: !input ec_sensor
  lower: !input low_limit
  upper: !input high_limit
trigger:
  - platform: numeric_state
    entity_id: !input ec_sensor
    above: !input high_limit
    id: high
  - platform: numeric_state
    entity_id: !input ec_sensor
    below: !input low_limit
    id: low
condition:
  - condition: template
    value_template: '{{ is_number(states(ec_entity)) and (lower | float) < (upper | float) }}'
action:
  - variables:
      message: >-
        {{ state_attr(ec_entity, 'friendly_name') or ec_entity }} is
        {{ 'above' if trigger.id == 'high' else 'below' }} the selected bound:
        {{ states(ec_entity) }} dS/m. Check the measurement and water content
        before changing irrigation or feed.
  - choose: []
    default: !input notify_action
