blueprint:
  name: TDR dryback-triggered irrigation
  description: >
    Fire an irrigation shot when the substrate has dried back past your
    target. Reads the dryback percent from a TDR Sensor node, opens a
    valve or pump for a set time, and only runs during the lights-on
    window with a minimum gap between shots.
  domain: automation
  source_url: https://github.com/JakeTheRabbit/TDR-Sensor/blob/main/blueprints/automation/tdr_dryback_irrigation.yaml
  input:
    dryback_sensor:
      name: Dryback percent sensor
      description: The "Dryback Percent" sensor from your TDR node.
      selector:
        entity:
          filter:
            domain: sensor
    dryback_threshold:
      name: Dryback target
      description: Shot fires when dryback rises above this percent.
      default: 15
      selector:
        number:
          min: 2
          max: 40
          step: 0.5
          unit_of_measurement: "%"
    irrigation_switch:
      name: Irrigation valve or pump
      description: The switch that runs water to this zone.
      selector:
        entity:
          filter:
            domain:
              - switch
              - input_boolean
    shot_duration:
      name: Shot duration
      description: How long to run the valve, in seconds.
      default: 30
      selector:
        number:
          min: 1
          max: 600
          step: 1
          unit_of_measurement: s
    start_time:
      name: Lights on
      description: Do not irrigate before this time.
      default: "06:00:00"
      selector:
        time: {}
    end_time:
      name: Lights off
      description: Do not irrigate after this time.
      default: "18:00:00"
      selector:
        time: {}
    min_interval:
      name: Minimum gap between shots
      description: Ignore new triggers for this many minutes after a shot.
      default: 30
      selector:
        number:
          min: 1
          max: 240
          step: 1
          unit_of_measurement: min

mode: single
max_exceeded: silent

variables:
  min_interval: !input min_interval

trigger:
  - platform: numeric_state
    entity_id: !input dryback_sensor
    above: !input dryback_threshold

condition:
  - condition: time
    after: !input start_time
    before: !input end_time
  - condition: template
    value_template: >
      {% set last = state_attr(this.entity_id, 'last_triggered') %}
      {{ last is none or (as_timestamp(now()) - as_timestamp(last)) > (min_interval | int) * 60 }}

action:
  - service: switch.turn_on
    target:
      entity_id: !input irrigation_switch
  - delay:
      seconds: !input shot_duration
  - service: switch.turn_off
    target:
      entity_id: !input irrigation_switch
