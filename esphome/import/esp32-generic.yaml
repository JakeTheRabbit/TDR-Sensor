# Adopted config for a generic ESP32. Created when you adopt a device
# flashed with the pre-built firmware. Packages pull from GitHub so
# updates flow through. Set your board and data pin below.

substitutions:
  name: tdr-sensor
  friendly_name: TDR Sensor
  board: esp32dev
  sdi12_data_pin: GPIO16
  sdi12_address: "0"
  sample_interval: 10s
  timezone: Pacific/Auckland

packages:
  tdr:
    url: https://github.com/JakeTheRabbit/TDR-Sensor
    ref: main
    refresh: 1d
    files:
      - esphome/packages/boards/esp32-generic.yaml
      - esphome/packages/tdr_sdi12_core.yaml
      - esphome/packages/tdr_analytics.yaml
      - esphome/packages/wifi_extras.yaml

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap: {}

ota:
  - platform: esphome
