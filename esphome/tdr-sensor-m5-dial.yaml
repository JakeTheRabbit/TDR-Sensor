# ===================================================================
# TDR Sensor on M5Stack Dial (WiFi, round display)
# -------------------------------------------------------------------
# Probe data wire on G2 (Port B). 5V on Port B red, GND on Port B
# black. The screen shows VWC, pore EC, dryback and steering mode.
#
# Needs secrets.yaml next to this file:
#   wifi_ssid: "YourNetwork"
#   wifi_password: "YourPassword"
# ===================================================================

substitutions:
  name: tdr-sensor
  friendly_name: TDR Sensor
  sdi12_data_pin: GPIO2
  sdi12_address: "0"
  sample_interval: 10s
  timezone: Pacific/Auckland

packages:
  board: !include packages/boards/m5-dial.yaml
  core: !include packages/tdr_sdi12_core.yaml
  analytics: !include packages/tdr_analytics.yaml
  wifi_extras: !include packages/wifi_extras.yaml
  # mqtt: !include packages/tdr_mqtt.yaml

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap: {}

ota:
  - platform: esphome

# To lock down the Home Assistant connection, add an encryption key:
# api:
#   encryption:
#     key: "GENERATE_ONE_AT_esphome.io/components/api"
