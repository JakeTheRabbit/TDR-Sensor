# Observed moisture trends, not plant physiology or measured irrigation delivery.
# Runtime history resets on reboot, data loss or a calibration change.
substitutions:
  timezone: Pacific/Auckland
time:
- platform: sntp
  id: tdr_time
  timezone: ${timezone}
  on_time:
  - seconds: 0
    minutes: 0
    hours: 0
    then:
    - lambda: |-
        id(g_shots_today)=0; id(g_max_dryback_today)=0;
globals:
- id: g_phase
  type: int
  restore_value: false
  initial_value: '0'
- id: g_peak
  type: float
  restore_value: false
  initial_value: NAN
- id: g_trough
  type: float
  restore_value: false
  initial_value: NAN
- id: g_cand_peak
  type: float
  restore_value: false
  initial_value: NAN
- id: g_irr_start
  type: float
  restore_value: false
  initial_value: NAN
- id: g_last_shot
  type: float
  restore_value: false
  initial_value: NAN
- id: g_max_dryback_today
  type: float
  restore_value: false
  initial_value: '0'
- id: g_shots_today
  type: int
  restore_value: false
  initial_value: '0'
- id: g_trough_ms
  type: uint32_t
  restore_value: false
  initial_value: '0'
- id: g_cand_peak_ms
  type: uint32_t
  restore_value: false
  initial_value: '0'
- id: g_last_irr_ms
  type: uint32_t
  restore_value: false
  initial_value: '0'
- id: g_analytics_revision
  type: uint32_t
  restore_value: false
  initial_value: '0'
- id: g_has_irrigated
  type: bool
  restore_value: false
  initial_value: 'false'
- id: g_rate_vwc
  type: std::vector<float>
  restore_value: false
  initial_value: std::vector<float>{}
- id: g_rate_ms
  type: std::vector<uint32_t>
  restore_value: false
  initial_value: std::vector<uint32_t>{}
number:
- platform: template
  id: rise_threshold
  name: Rise threshold
  optimistic: true
  restore_value: true
  initial_value: 1.5
  min_value: 0.3
  max_value: 10
  step: 0.1
  mode: box
  entity_category: config
  unit_of_measurement: pp
  web_server:
    sorting_group_id: sg_tuning
- platform: template
  id: fall_confirm
  name: Plateau confirm drop
  optimistic: true
  restore_value: true
  initial_value: 0.8
  min_value: 0.1
  max_value: 5
  step: 0.1
  mode: box
  entity_category: config
  unit_of_measurement: pp
  web_server:
    sorting_group_id: sg_tuning
- platform: template
  id: peak_confirm_min
  name: Plateau confirm time
  optimistic: true
  restore_value: true
  initial_value: 10
  min_value: 1
  max_value: 60
  step: 1
  mode: box
  entity_category: config
  unit_of_measurement: min
  web_server:
    sorting_group_id: sg_tuning
- platform: template
  id: irr_window_min
  name: Rise detection window
  optimistic: true
  restore_value: true
  initial_value: 20
  min_value: 1
  max_value: 120
  step: 1
  mode: box
  entity_category: config
  unit_of_measurement: min
  web_server:
    sorting_group_id: sg_tuning
- platform: template
  id: target_dryback
  name: Dryback observation threshold
  optimistic: true
  restore_value: true
  initial_value: 10
  min_value: 1
  max_value: 40
  step: 0.1
  mode: box
  entity_category: config
  unit_of_measurement: pp
  web_server:
    sorting_group_id: sg_tuning
sensor:
- platform: copy
  source_id: vwc
  id: vwc_stream
  internal: true
  on_value:
  - script.execute: tdr_process
- platform: template
  id: peak_vwc
  name: Peak VWC
  update_interval: 5s
  accuracy_decimals: 2
  state_class: measurement
  unit_of_measurement: '%'
  web_server:
    sorting_group_id: sg_analytics
  lambda: |-
    return id(g_peak);
- platform: template
  id: trough_vwc
  name: Trough VWC
  update_interval: 5s
  accuracy_decimals: 2
  state_class: measurement
  unit_of_measurement: '%'
  web_server:
    sorting_group_id: sg_analytics
  lambda: |-
    return id(g_trough);
- platform: template
  id: dryback_pts
  name: Dryback
  update_interval: 5s
  accuracy_decimals: 2
  state_class: measurement
  unit_of_measurement: pp
  web_server:
    sorting_group_id: sg_analytics
  lambda: |-
    if (!id(vwc_ready).state || !std::isfinite(id(g_peak))) return NAN;
    return std::max(0.0f,id(g_peak)-id(vwc).state);
- platform: template
  id: dryback_pct
  name: Dryback Percent
  update_interval: 5s
  accuracy_decimals: 2
  state_class: measurement
  unit_of_measurement: '%'
  web_server:
    sorting_group_id: sg_analytics
  lambda: |-
    if (!id(vwc_ready).state || !std::isfinite(id(g_peak)) || id(g_peak)<=0) return NAN;
    return std::max(0.0f,100*(id(g_peak)-id(vwc).state)/id(g_peak));
- platform: template
  id: last_shot_size
  name: Last detected rise
  update_interval: 5s
  accuracy_decimals: 2
  state_class: measurement
  unit_of_measurement: pp
  web_server:
    sorting_group_id: sg_analytics
  lambda: |-
    return id(g_last_shot);
- platform: template
  id: max_dryback_today
  name: Max Dryback Today
  update_interval: 5s
  accuracy_decimals: 2
  state_class: measurement
  unit_of_measurement: pp
  web_server:
    sorting_group_id: sg_analytics
  lambda: |-
    if (!id(tdr_time).now().is_valid()) return NAN;
    return id(g_max_dryback_today);
- platform: template
  id: irrigations_today
  name: Detected wettings today
  update_interval: 5s
  accuracy_decimals: 2
  state_class: measurement
  web_server:
    sorting_group_id: sg_analytics
  lambda: |-
    if (!id(tdr_time).now().is_valid()) return NAN;
    return id(g_shots_today);
- platform: template
  id: time_since_irr
  name: Time Since Irrigation
  update_interval: 5s
  accuracy_decimals: 2
  state_class: measurement
  unit_of_measurement: min
  web_server:
    sorting_group_id: sg_analytics
  lambda: |-
    if (!id(g_has_irrigated)) return NAN;
    return (uint32_t)(millis()-id(g_last_irr_ms))/60000.0f;
- platform: template
  id: dryback_rate
  name: Dryback Rate
  update_interval: 5s
  accuracy_decimals: 2
  state_class: measurement
  unit_of_measurement: pp/h
  web_server:
    sorting_group_id: sg_analytics
  lambda: |-
    if (!id(vwc_ready).state || id(g_phase)!=0 || id(g_rate_vwc).size()<2) return NAN;
    const float hours=(uint32_t)(id(g_rate_ms).back()-id(g_rate_ms).front())/3600000.0f;
    if (hours<0.15) return NAN;
    return std::max(0.0f,(id(g_rate_vwc).front()-id(g_rate_vwc).back())/hours);
binary_sensor:
- platform: template
  name: Wetting detected
  id: irrigating
  lambda: return id(vwc_ready).state && id(g_phase)==1;
- platform: template
  name: Sensor fault
  device_class: problem
  lambda: return !id(sensor_fresh).state;
text_sensor:
- platform: template
  name: Water trend
  id: steering_mode
  update_interval: 5s
  lambda: |-
    if (!id(vwc_ready).state) return {"VWC unavailable"};
    if (id(g_phase)==1) return {"Wetting detected"};
    if (!std::isfinite(id(g_peak))) return {"Waiting for a wetting cycle"};
    return {"Tracking dryback"};
script:
- id: tdr_process
  then:
  - lambda: |-
      if (!id(vwc_ready).state || !std::isfinite(id(vwc).state) || id(g_analytics_revision)!=id(cal_revision)) {
      id(g_phase)=0; id(g_peak)=NAN; id(g_trough)=NAN; id(g_cand_peak)=NAN;
      id(g_irr_start)=NAN; id(g_last_shot)=NAN; id(g_has_irrigated)=false;
      id(g_shots_today)=0; id(g_max_dryback_today)=0;
      id(g_rate_vwc).clear(); id(g_rate_ms).clear();
      id(g_analytics_revision)=id(cal_revision);
        return;
      }
      const float v=id(vwc).state;
      const uint32_t now=millis();
      // Monotonic timers work before time sync and across the millis rollover.
      // A flat, freshly received RAW response is not a communication failure.
      if (id(g_phase)==0) {
        if (!std::isfinite(id(g_trough)) || v<=id(g_trough)) {id(g_trough)=v; id(g_trough_ms)=now;}
        if (std::isfinite(id(g_peak))) id(g_max_dryback_today)=std::max(id(g_max_dryback_today),id(g_peak)-v);
        if (v-id(g_trough)>=id(rise_threshold).state) {
          if ((uint32_t)(now-id(g_trough_ms))>id(irr_window_min).state*60000) {
            id(g_trough)=v; id(g_trough_ms)=now;
          } else {
            id(g_phase)=1; id(g_irr_start)=id(g_trough); id(g_cand_peak)=v; id(g_cand_peak_ms)=now;
            id(g_last_irr_ms)=now; id(g_has_irrigated)=true;
            if (id(tdr_time).now().is_valid()) id(g_shots_today)++;
            id(g_rate_vwc).clear(); id(g_rate_ms).clear();
          }
        }
      } else {
        // Strict > matters: equal readings must allow a plateau to complete.
        if (!std::isfinite(id(g_cand_peak)) || v>id(g_cand_peak)) {id(g_cand_peak)=v; id(g_cand_peak_ms)=now;}
        if (id(g_cand_peak)-v>=id(fall_confirm).state || (uint32_t)(now-id(g_cand_peak_ms))>=id(peak_confirm_min).state*60000) {
          id(g_peak)=id(g_cand_peak); id(g_last_shot)=id(g_peak)-id(g_irr_start);
          id(g_phase)=0; id(g_trough)=v; id(g_trough_ms)=now; id(g_cand_peak)=NAN;
          id(g_rate_vwc).clear(); id(g_rate_ms).clear();
        }
      }
- id: reset_analytics
  then:
  - lambda: |-
      id(g_phase)=0; id(g_peak)=NAN; id(g_trough)=NAN; id(g_cand_peak)=NAN;
      id(g_irr_start)=NAN; id(g_last_shot)=NAN; id(g_has_irrigated)=false;
      id(g_shots_today)=0; id(g_max_dryback_today)=0;
      id(g_rate_vwc).clear(); id(g_rate_ms).clear();
      id(g_analytics_revision)=id(cal_revision);
button:
- platform: template
  name: Reset Analytics
  entity_category: config
  on_press:
  - script.execute: reset_analytics
  web_server:
    sorting_group_id: sg_calibration
interval:
- interval: 300s
  then:
  - lambda: |-
      if (!id(vwc_ready).state || id(g_phase)!=0) return;
      id(g_rate_vwc).push_back(id(vwc).state); id(g_rate_ms).push_back(millis());
      while (!id(g_rate_ms).empty() && ((uint32_t)(millis()-id(g_rate_ms).front())>3600000U || id(g_rate_ms).size()>13)) {
        id(g_rate_vwc).erase(id(g_rate_vwc).begin()); id(g_rate_ms).erase(id(g_rate_ms).begin());
      }
