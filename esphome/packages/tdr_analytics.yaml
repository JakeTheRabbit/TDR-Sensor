    name: "Reset Analytics"
    id: btn_reset_analytics
    entity_category: config
    icon: mdi:restore-alert
    web_server:
      sorting_group_id: sg_tuning
      sorting_weight: 30
    on_press:
      - lambda: |-
          id(g_phase) = 0;
          id(g_peak) = NAN; id(g_peak_ts) = 0;
          id(g_trough) = NAN; id(g_trough_ts) = 0;
          id(g_cand_peak) = NAN; id(g_cand_peak_ts) = 0;
          id(g_irr_start) = NAN;
          id(g_last_irr_ts) = 0;
          id(g_last_shot) = NAN;
          id(g_max_dryback_today) = 0.0f;
          id(g_daily_peak) = 0.0f;
          id(g_lightsoff_vwc) = NAN;
          id(g_overnight_db) = NAN;
          id(g_pwec_at_fc) = NAN;
          id(g_cycles) = 0;
          id(g_shots_today) = 0;
          id(g_rate_vwc).clear();
          id(g_rate_ts).clear();
          id(g_fc_days).clear();
          ESP_LOGI("analytics", "Analytics fully reset");

  - platform: template
    name: "Reset Daily Counters"
