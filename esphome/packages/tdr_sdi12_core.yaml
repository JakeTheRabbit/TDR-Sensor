# MT22 SDI-12 measurement and weighed calibration. See docs/CALIBRATION.md.
# Wet index is not VWC. Calibration captures require Calibration mode ON.
substitutions:
  name: tdr-sensor
  friendly_name: TDR Sensor
  sdi12_data_pin: GPIO26
  sdi12_address: '0'
  sample_interval: 30s
  sample_timeout: 90s
  sample_timeout_ms: '90000'
esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.8.2
  project:
    name: jaketherabbit.tdr-sensor
    version: 3.0.0
  on_boot:
    priority: -100
    then:
    - lambda: id(g_ready) = true;
logger:
  level: INFO
api:
  reboot_timeout: 0s
preferences:
  flash_write_interval: 5s
prometheus: {}
web_server:
  port: 80
  version: 3
  local: true
  sorting_groups:
  - id: sg_live
    name: Readings
    sorting_weight: 10
  - id: sg_analytics
    name: Water-content trends
    sorting_weight: 20
  - id: sg_calibration
    name: Calibration
    sorting_weight: 30
  - id: sg_tuning
    name: Trend settings
    sorting_weight: 40
  - id: sg_diag
    name: Diagnostics
    sorting_weight: 50
external_components:
- source: github://ssieb/esphome@5c80bde7d6ab68b4c73bc5e0a6646209315991a3
  components:
  - uart
- source: github://ssieb/esphome_components@b31b547ff269672abbb9a1840cd777b7c118723f
  components:
  - sdi12
uart:
- id: sdi12_uart
  tx_pin:
    number: ${sdi12_data_pin}
    inverted: true
  baud_rate: 1200
  data_bits: 7
  parity: even
  stop_bits: 1
  half_duplex: true
sdi12:
- id: sdi12_bus
  uart_id: sdi12_uart
globals:
- id: g_ready
  type: bool
  restore_value: false
  initial_value: 'false'
- id: raw_window
  type: std::array<float, 10>
  restore_value: false
  initial_value: std::array<float, 10>{}
- id: raw_count
  type: int
  restore_value: false
  initial_value: '0'
- id: raw_pos
  type: int
  restore_value: false
  initial_value: '0'
- id: last_raw_ms
  type: uint32_t
  restore_value: false
  initial_value: '0'
- id: raw_seen
  type: bool
  restore_value: false
  initial_value: 'false'
- id: cal_revision
  type: uint32_t
  restore_value: false
  initial_value: '0'
- id: wet_raw
  type: float
  restore_value: true
  initial_value: NAN
- id: a_raw
  type: float
  restore_value: true
  initial_value: NAN
- id: a_vwc
  type: float
  restore_value: true
  initial_value: NAN
- id: b_raw
  type: float
  restore_value: true
  initial_value: NAN
- id: b_vwc
  type: float
  restore_value: true
  initial_value: NAN
- id: c_raw
  type: float
  restore_value: true
  initial_value: NAN
- id: c_vwc
  type: float
  restore_value: true
  initial_value: NAN
- id: ec_current_frame
  type: bool
  restore_value: false
  initial_value: 'false'
number:
- platform: template
  id: weighed_input
  name: Weighed reference VWC
  optimistic: true
  restore_value: false
  initial_value: 0
  min_value: 0
  max_value: 100
  step: 0.1
  mode: box
  entity_category: config
  unit_of_measurement: '%'
  web_server:
    sorting_group_id: sg_calibration
- platform: template
  id: capture_spread_limit
  name: Capture maximum RAW spread
  optimistic: true
  restore_value: true
  initial_value: 10
  min_value: 1
  max_value: 100
  step: 1
  mode: box
  entity_category: config
  unit_of_measurement: counts
  web_server:
    sorting_group_id: sg_calibration
- platform: template
  id: validation_tolerance
  name: Third-point tolerance
  optimistic: true
  restore_value: true
  initial_value: 3
  min_value: 0.5
  max_value: 10
  step: 0.1
  mode: box
  entity_category: config
  unit_of_measurement: pp
  web_server:
    sorting_group_id: sg_calibration
  on_value:
  - lambda: if (id(g_ready)) { id(cal_revision)++; id(vwc_ready).publish_state(false); id(vwc).publish_state(NAN);
      }
- platform: template
  id: ec_gain
  name: Bulk EC gain
  optimistic: true
  restore_value: true
  initial_value: 1
  min_value: 0.25
  max_value: 2
  step: 0.001
  mode: box
  entity_category: config
  web_server:
    sorting_group_id: sg_calibration
- platform: template
  id: ec_offset_us
  name: Bulk EC offset
  optimistic: true
  restore_value: true
  initial_value: 0
  min_value: -1000
  max_value: 1000
  step: 1
  mode: box
  entity_category: config
  unit_of_measurement: µS/cm
  web_server:
    sorting_group_id: sg_calibration
- platform: template
  id: temp_offset
  name: Temperature offset
  optimistic: true
  restore_value: true
  initial_value: 0
  min_value: -5
  max_value: 5
  step: 0.1
  mode: box
  entity_category: config
  unit_of_measurement: °C
  web_server:
    sorting_group_id: sg_calibration
- platform: template
  id: hilhorst_e0
  name: Experimental Hilhorst offset
  optimistic: true
  restore_value: true
  initial_value: 4.1
  min_value: 0
  max_value: 20
  step: 0.1
  mode: box
  entity_category: config
  web_server:
    sorting_group_id: sg_calibration
- platform: template
  id: pwec_min_vwc
  name: Experimental pwEC minimum VWC
  optimistic: true
  restore_value: true
  initial_value: 30
  min_value: 10
  max_value: 90
  step: 1
  mode: box
  entity_category: config
  unit_of_measurement: '%'
  web_server:
    sorting_group_id: sg_calibration
select:
- platform: template
  id: substrate_profile
  name: Substrate Profile
  optimistic: true
  restore_value: true
  initial_option: Rockwool cube on slab
  options:
  - Rockwool cube
  - Rockwool cube on slab
  - Rockwool slab
  - Coco
  - Peat mix
  - Mineral soil
  entity_category: config
  on_value:
  - if:
      condition:
        lambda: return id(g_ready);
      then:
      - script.execute: clear_calibration
switch:
- platform: template
  id: calibration_mode
  name: Calibration mode
  optimistic: true
  restore_mode: ALWAYS_OFF
  entity_category: config
  on_turn_on:
  - script.execute: restart_capture
  on_turn_off:
  - script.execute: restart_capture
- platform: template
  id: enable_pwec
  name: Experimental pwEC estimate
  optimistic: true
  restore_mode: ALWAYS_OFF
  entity_category: config
binary_sensor:
- platform: template
  name: Capture ready
  id: capture_ready
- platform: template
  name: VWC ready
  id: vwc_ready
- platform: template
  name: Sensor data fresh
  id: sensor_fresh
text_sensor:
- platform: template
  name: Calibration status
  id: calibration_status
  update_interval: never
- platform: template
  name: Last calibration action
  id: last_action
  update_interval: never
sensor:
- platform: sdi12
  address: ${sdi12_address}
  update_interval: ${sample_interval}
  sensors:
  - index: 1
    name: RAW Counts
    id: raw_counts
    accuracy_decimals: 0
    entity_category: diagnostic
    on_value:
    - lambda: |-
        id(ec_current_frame)=false;
        if (!std::isfinite(x) || x <= 0 || x > 4095) {
          id(raw_count)=0; id(raw_seen)=false; return;
        }
        const uint32_t now=millis();
        if (!id(raw_seen) || (uint32_t)(now-id(last_raw_ms)) > ${sample_timeout_ms}U) {
          id(raw_count)=0; id(raw_pos)=0;
        }
        id(raw_window)[id(raw_pos)]=x;
        id(raw_pos)=(id(raw_pos)+1)%10;
        if (id(raw_count)<10) id(raw_count)++;
        id(last_raw_ms)=now; id(raw_seen)=true;
    - script.execute: publish_readings
  - index: 2
    name: Temperature
    id: substrate_temp
    unit_of_measurement: °C
    accuracy_decimals: 1
    device_class: temperature
    state_class: measurement
    filters:
    - lambda: 'return std::isfinite(x) && x >= -40 && x <= 80 ? x + id(temp_offset).state : NAN;'
    - timeout: ${sample_timeout}
  - index: 3
    name: Bulk EC 25C
    id: bulk_ec_25
    unit_of_measurement: dS/m
    accuracy_decimals: 3
    state_class: measurement
    filters:
    - lambda: |-
        if (!std::isfinite(x) || x < 0 || x > 23000) return NAN;
        const float corrected=(x*id(ec_gain).state+id(ec_offset_us).state)/1000.0f;
        return std::isfinite(corrected) && corrected >= 0 && corrected <= 23 ? corrected : NAN;
    - timeout: ${sample_timeout}
    on_value:
    - lambda: id(ec_current_frame)=std::isfinite(x);
- platform: template
  id: vwc_poly
  name: VWC generic estimate
  update_interval: never
  accuracy_decimals: 2
  state_class: measurement
  unit_of_measurement: '%'
  entity_category: diagnostic
  web_server:
    sorting_group_id: sg_diag
- platform: template
  id: vwc_weighed
  name: VWC two-point estimate
  update_interval: never
  accuracy_decimals: 2
  state_class: measurement
  unit_of_measurement: '%'
  entity_category: diagnostic
  web_server:
    sorting_group_id: sg_diag
- platform: template
  id: vwc
  name: VWC
  update_interval: never
  accuracy_decimals: 2
  state_class: measurement
  unit_of_measurement: '%'
  web_server:
    sorting_group_id: sg_live
- platform: template
  id: wet_index
