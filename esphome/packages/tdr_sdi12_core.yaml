  entity_category: diagnostic
  web_server:
    sorting_group_id: sg_calibration
- platform: uptime
  name: Uptime
  device_class: duration
  state_class: total_increasing
button:
- platform: template
  name: Save wet reference
  entity_category: config
  on_press:
  - script.execute:
      id: capture_reference
      kind: 0
  web_server:
    sorting_group_id: sg_calibration
- platform: template
  name: Capture weighed point A
  entity_category: config
  on_press:
  - script.execute:
      id: capture_reference
      kind: 1
  web_server:
    sorting_group_id: sg_calibration
- platform: template
  name: Capture weighed point B
  entity_category: config
  on_press:
  - script.execute:
      id: capture_reference
      kind: 2
  web_server:
    sorting_group_id: sg_calibration
- platform: template
  name: Check independent weighed point C
  entity_category: config
  on_press:
  - script.execute:
      id: capture_reference
      kind: 3
  web_server:
    sorting_group_id: sg_calibration
- platform: template
  name: Restart capture window
  entity_category: config
  on_press:
  - script.execute: restart_capture
  web_server:
    sorting_group_id: sg_calibration
- platform: template
  name: Clear calibration references
  entity_category: config
  on_press:
  - script.execute: clear_calibration
  web_server:
    sorting_group_id: sg_calibration
- platform: restart
  name: Restart
  entity_category: diagnostic
- platform: safe_mode
  name: Restart Safe Mode
  entity_category: diagnostic
script:
- id: restart_capture
  then:
  - lambda: |-
      id(raw_count)=0; id(raw_pos)=0; id(cal_revision)++;
      id(vwc_ready).publish_state(false); id(vwc).publish_state(NAN);
      id(capture_ready).publish_state(false);
      id(last_action).publish_state("Window restarted. Wait for 10 new readings before capture.");
- id: clear_calibration
  then:
  - script.execute: restart_capture
  - lambda: |-
      id(wet_raw)=NAN; id(a_raw)=NAN; id(a_vwc)=NAN;
      id(b_raw)=NAN; id(b_vwc)=NAN; id(c_raw)=NAN; id(c_vwc)=NAN;
      id(cal_revision)++;
      id(vwc_ready).publish_state(false); id(vwc).publish_state(NAN);
      id(last_action).publish_state("References cleared. Wait 10 seconds before power off.");
  - script.execute: publish_readings
- id: capture_reference
  parameters:
    kind: int
  then:
  - lambda: |-
      if (!id(calibration_mode).state) {
        id(last_action).publish_state("Turn Calibration mode ON before capturing references."); return;
      }
      if (!id(raw_seen) || (uint32_t)(millis()-id(last_raw_ms)) > ${sample_timeout_ms}U || id(raw_count)<10) {
        id(last_action).publish_state("Not saved: wait for 10 fresh readings."); return;
      }
      float lo=id(raw_window)[0], hi=lo, sum=0;
      for (float r:id(raw_window)) {lo=std::min(lo,r); hi=std::max(hi,r); sum+=r;}
      if (!std::isfinite(id(capture_spread_limit).state) || hi-lo > id(capture_spread_limit).state) {
        id(last_action).publish_state("Not saved: RAW is still changing. Check contact and wait."); return;
      }
      const float r=sum/10.0f;
      if (kind==0) {
        id(wet_raw)=r;
        id(last_action).publish_state("Wet reference saved. Index 100 is not 100% VWC. Wait 10s before power off.");
      } else {
        const float v=id(weighed_input).state;
        if (!std::isfinite(v) || v<=0 || v>=100) {
          id(last_action).publish_state("Not saved: enter a measured VWC between 0 and 100 first."); return;
        }
        if (kind==1) {id(a_raw)=r; id(a_vwc)=v; id(c_raw)=NAN; id(c_vwc)=NAN;}
        if (kind==2) {id(b_raw)=r; id(b_vwc)=v; id(c_raw)=NAN; id(c_vwc)=NAN;}
        if (kind==3) {id(c_raw)=r; id(c_vwc)=v;}
        id(weighed_input).make_call().set_value(0).perform();
        id(cal_revision)++;
        id(last_action).publish_state("Point saved. Check Calibration status and saved values. Wait 10s before power off.");
      }
  - script.execute: publish_readings
- id: publish_readings
  mode: restart
  then:
  - delay: 100ms
  - lambda: |-
      // BEGIN TESTABLE MATH
      auto generic = [](double R, bool mineral) -> double {
        if (!std::isfinite(R) || R <= 0 || R > 4095) return NAN;
        return mineral ? 100.0 * (0.0003879 * R - 0.6956) :
          100.0 * (((6.771e-10 * R - 5.105e-6) * R + 1.302e-2) * R - 10.848);
      };
      auto fit = [&](double R, double ar, double av, double br, double bv, bool mineral) -> double {
        if (!std::isfinite(ar) || !std::isfinite(br) || !std::isfinite(av) || !std::isfinite(bv) ||
            ar <= 0 || br <= 0 || ar > 4095 || br > 4095 || av <= 0 || bv <= 0 || av >= 100 || bv >= 100 ||
            std::abs(ar-br) < 100 || std::abs(av-bv) < 10 || (ar-br)*(av-bv) <= 0 ||
            !std::isfinite(R) || R < std::min(ar,br) || R > std::max(ar,br)) return NAN;
        const double ga=generic(ar,mineral), gb=generic(br,mineral);
        if (!std::isfinite(ga) || !std::isfinite(gb) || std::abs(gb-ga) < 0.1) return NAN;
        const double v=av+(generic(R,mineral)-ga)*(bv-av)/(gb-ga);
        return std::isfinite(v) && v >= 0 && v <= 100 ? v : NAN;
      };
      auto check = [&](double ar, double av, double br, double bv, double cr, double cv,
                       double tolerance, bool mineral) -> double {
        const double margin = 0.1 * std::abs(ar-br);
        if (!std::isfinite(cr) || !std::isfinite(cv) || cv <= 0 || cv >= 100 ||
            !std::isfinite(tolerance) || tolerance <= 0 || tolerance > 10 ||
            cr <= std::min(ar,br)+margin || cr >= std::max(ar,br)-margin) return NAN;
        return fit(cr,ar,av,br,bv,mineral)-cv;
      };
      // END TESTABLE MATH
      const bool mineral=id(substrate_profile).current_option() == "Mineral soil";
      const uint32_t age=millis()-id(last_raw_ms);
      const bool fresh=id(raw_seen) && age <= ${sample_timeout_ms}U;
      id(sensor_fresh).publish_state(fresh);
      id(sample_age).publish_state(id(raw_seen) ? age/1000.0f : NAN);
      float average=NAN, spread=NAN;
      if (fresh && id(raw_count)>0) {
        float lo=id(raw_window)[0], hi=lo, sum=0;
        for(int i=0;i<id(raw_count);++i) {float r=id(raw_window)[i]; lo=std::min(lo,r); hi=std::max(hi,r); sum+=r;}
        average=sum/id(raw_count); spread=hi-lo;
      }
      id(raw_average).publish_state(average); id(raw_spread).publish_state(spread);
      id(capture_ready).publish_state(id(calibration_mode).state && fresh && id(raw_count)==10 &&
        std::isfinite(spread) && spread <= id(capture_spread_limit).state);
      id(saved_wet_raw).publish_state(id(wet_raw));
      id(saved_a_raw).publish_state(id(a_raw));
      id(saved_a_vwc).publish_state(id(a_vwc));
      id(saved_b_raw).publish_state(id(b_raw));
      id(saved_b_vwc).publish_state(id(b_vwc));
      id(saved_c_raw).publish_state(id(c_raw));
      id(saved_c_vwc).publish_state(id(c_vwc));

      const double ar=id(a_raw), av=id(a_vwc), br=id(b_raw), bv=id(b_vwc);
      const double err=check(ar,av,br,bv,id(c_raw),id(c_vwc),id(validation_tolerance).state,mineral);
      id(validation_error).publish_state(err);
      const double R=fresh ? id(raw_counts).state : NAN;
      const double g=generic(R,mineral);
      id(vwc_poly).publish_state(std::isfinite(g) && g>=0 && g<=100 ? g : NAN);
      const double wet=generic(id(wet_raw),mineral);
      const double idx=std::isfinite(wet) && wet>5 && std::isfinite(g) && g>=0 ? 100*g/wet : NAN;
      id(wet_index).publish_state(idx); id(wet_drop).publish_state(std::isfinite(idx) ? 100-idx : NAN);
      const double fitted=fit(R,ar,av,br,bv,mineral);
      id(vwc_weighed).publish_state(fitted);
      const bool checked=std::isfinite(err) && std::abs(err)<=id(validation_tolerance).state;
      const bool ready=fresh && id(raw_count)>=3 && checked && std::isfinite(fitted) && !id(calibration_mode).state;
      id(vwc_ready).publish_state(ready);
      // Publish headline VWC last: analytics consumes its fresh validity state.
      const double inner=((2.887e-9*R-2.080e-5)*R+5.276e-2)*R-43.39;
      const double eb=inner*inner;
      id(permittivity).publish_state(std::isfinite(eb) && eb>=1 && eb<=100 ? eb : NAN);
      // MT22 EC is already normalised to 25 C. Use water permittivity at 25 C.
      // This optional Hilhorst output remains a model, not a measured pore EC.
      const double denom=eb-id(hilhorst_e0).state, bulk=id(bulk_ec_25).state;
      const double model=bulk*78.45/denom;
      const bool model_ok=id(enable_pwec).state && id(ec_current_frame) && ready && fitted>=id(pwec_min_vwc).state &&
        std::isfinite(bulk) && bulk>=0 && std::isfinite(eb) && eb>=1 && eb<=100 && denom>0.5 &&
        std::isfinite(model) && model>=0 && model<=30;
      id(pwec).publish_state(model_ok ? model : NAN);
      if (!fresh) id(calibration_status).publish_state("No fresh RAW data. Check wiring, power and sensor.");
      else if (id(calibration_mode).state) id(calibration_status).publish_state(checked ?
        "Third point passed. Turn Calibration mode OFF after returning to final placement." :
        "Calibration mode: headline VWC and trends paused. Capture A, B and independent C.");
      else if (!std::isfinite(ar) || !std::isfinite(br)) id(calibration_status).publish_state(
        "Weighed A/B missing. Wet index and generic estimate are not calibrated VWC.");
      else if (!checked) id(calibration_status).publish_state(
        "A/B or independent C not valid, or check error exceeds tolerance. VWC withheld.");
      else if (!std::isfinite(fitted)) id(calibration_status).publish_state("Outside weighed A/B range. VWC withheld.");
      else if (!ready) id(calibration_status).publish_state("Waiting for three new readings after reset.");
      else id(calibration_status).publish_state("VWC: weighed A/B with third-point check. Valid only for this substrate and placement.");
      id(vwc).publish_state(ready ? fitted : NAN);
interval:
- interval: 5s
  then:
  - script.execute: publish_readings
