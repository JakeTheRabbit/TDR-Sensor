  update_interval: never
  accuracy_decimals: 2
  state_class: measurement
  unit_of_measurement: counts
  entity_category: diagnostic
  web_server:
    sorting_group_id: sg_calibration
- platform: template
  id: raw_spread
  name: Capture RAW spread
  update_interval: never
  accuracy_decimals: 2
  state_class: measurement
  unit_of_measurement: counts
  entity_category: diagnostic
  web_server:
    sorting_group_id: sg_calibration
- platform: template
  id: sample_age
  name: RAW sample age
  update_interval: never
  accuracy_decimals: 2
  state_class: measurement
  unit_of_measurement: s
  entity_category: diagnostic
  web_server:
    sorting_group_id: sg_diag
- platform: template
  id: validation_error
  name: Third-point error
  update_interval: never
  accuracy_decimals: 2
  state_class: measurement
  unit_of_measurement: pp
  entity_category: diagnostic
  web_server:
    sorting_group_id: sg_calibration
- platform: template
  id: saved_wet_raw
  name: Saved Wet RAW
  update_interval: never
  accuracy_decimals: 2
  state_class: measurement
  unit_of_measurement: counts
  entity_category: diagnostic
  web_server:
    sorting_group_id: sg_calibration
- platform: template
  id: saved_a_raw
  name: Saved A RAW
  update_interval: never
  accuracy_decimals: 2
  state_class: measurement
  unit_of_measurement: counts
  entity_category: diagnostic
  web_server:
    sorting_group_id: sg_calibration
- platform: template
  id: saved_a_vwc
  name: Saved A VWC
  update_interval: never
  accuracy_decimals: 2
  state_class: measurement
  unit_of_measurement: '%'
  entity_category: diagnostic
  web_server:
    sorting_group_id: sg_calibration
- platform: template
  id: saved_b_raw
  name: Saved B RAW
  update_interval: never
  accuracy_decimals: 2
  state_class: measurement
  unit_of_measurement: counts
  entity_category: diagnostic
  web_server:
    sorting_group_id: sg_calibration
- platform: template
  id: saved_b_vwc
  name: Saved B VWC
  update_interval: never
  accuracy_decimals: 2
  state_class: measurement
