# Factory build for a generic ESP32 (esp32dev). This is what CI
# compiles into the pre-built firmware. Ships with no WiFi
# credentials, provision from the browser at web.esphome.io (Improv
# over serial) or by joining the fallback hotspot.

substitutions:
  name: tdr-sensor
  friendly_name: TDR Sensor
  board: esp32dev
  sdi12_data_pin: GPIO16
  sdi12_address: "0"
  sample_interval: 10s
  timezone: Pacific/Auckland

packages:
  board: !include ../packages/boards/esp32-generic.yaml
  core: !include ../packages/tdr_sdi12_core.yaml
  analytics: !include ../packages/tdr_analytics.yaml
  wifi_extras: !include ../packages/wifi_extras.yaml

esphome:
  name_add_mac_suffix: true

wifi:
  ap: {}

improv_serial:

ota:
  - platform: esphome

dashboard_import:
  package_import_url: github://JakeTheRabbit/TDR-Sensor/esphome/import/esp32-generic.yaml@main
  import_full_config: true
