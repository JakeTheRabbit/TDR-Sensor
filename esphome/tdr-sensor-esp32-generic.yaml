# ===================================================================
# TDR Sensor on a generic ESP32 board
# -------------------------------------------------------------------
# Set your exact board and the SDI-12 data pin below. GPIO16 is a
# safe default on most ESP32 dev boards. Power the probe from 5V
# (Vin/5V pin), not the 3.3V rail, the MT22 needs at least 3.6V.
#
# Needs secrets.yaml next to this file:
#   wifi_ssid: "YourNetwork"
#   wifi_password: "YourPassword"
# ===================================================================

substitutions:
  name: tdr-sensor
  friendly_name: TDR Sensor
  board: esp32dev
  sdi12_data_pin: GPIO16
  sdi12_address: "0"
  sample_interval: 10s
  timezone: Pacific/Auckland

packages:
  board: !include packages/boards/esp32-generic.yaml
  core: !include packages/tdr_sdi12_core.yaml
  analytics: !include packages/tdr_analytics.yaml
  wifi_extras: !include packages/wifi_extras.yaml
  # mqtt: !include packages/tdr_mqtt.yaml

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap: {}

ota:
  - platform: esphome

# To lock down the Home Assistant connection, add an encryption key:
# api:
#   encryption:
#     key: "GENERATE_ONE_AT_esphome.io/components/api"
