<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Segoe UI, Roboto, sans-serif">
  <rect width="720" height="360" rx="14" fill="#1b2430"/>
  <text x="30" y="44" fill="#e8efe9" font-size="22" font-weight="700">M5Stack Dial wiring</text>
  <text x="30" y="68" fill="#9fb0a4" font-size="14">Probe on Port B (G1/G2). Port A is kept for the internal I2C. Colours are for the Infiwin MT22.</text>

  <circle cx="145" cy="200" r="90" fill="#33384a" stroke="#5a6178"/>
  <circle cx="145" cy="200" r="66" fill="#0f1512" stroke="#26332b"/>
  <text x="145" y="196" fill="#e8efe9" font-size="15" font-weight="700" text-anchor="middle">M5 Dial</text>
  <text x="145" y="216" fill="#9fb0a4" font-size="12" text-anchor="middle">ESP32-S3</text>
  <rect x="235" y="165" width="16" height="80" rx="3" fill="#14251c"/>
  <text x="243" y="158" fill="#9fb0a4" font-size="11" text-anchor="middle">Port B</text>
  <circle cx="243" cy="182" r="5" fill="#e23b3b"/>
  <circle cx="243" cy="205" r="5" fill="#e5c84f"/>
  <circle cx="243" cy="228" r="5" fill="#b9a06a"/>

  <rect x="500" y="120" width="180" height="160" rx="12" fill="#17201b" stroke="#26332b"/>
  <text x="590" y="150" fill="#e8efe9" font-size="15" font-weight="700" text-anchor="middle">SDI-12 probe</text>
  <text x="590" y="170" fill="#9fb0a4" font-size="12" text-anchor="middle">MT22 / TEROS 12</text>
  <circle cx="500" cy="200" r="5" fill="#f2f2f2"/>
  <circle cx="500" cy="225" r="5" fill="#e23b3b"/>
  <circle cx="500" cy="250" r="5" fill="#b9a06a"/>

  <path d="M243 182 C 360 182, 400 225, 500 225" stroke="#e23b3b" stroke-width="4" fill="none"/>
  <path d="M251 205 C 360 205, 400 200, 500 200" stroke="#f2f2f2" stroke-width="4" fill="none"/>
  <path d="M243 228 C 360 228, 400 250, 500 250" stroke="#b9a06a" stroke-width="4" fill="none"/>

  <text x="300" y="300" fill="#e8efe9" font-size="13" font-weight="700">G2</text>
  <text x="300" y="317" fill="#9fb0a4" font-size="12">Data (red)</text>
  <text x="410" y="300" fill="#e8efe9" font-size="13" font-weight="700">5V</text>
  <text x="410" y="317" fill="#9fb0a4" font-size="12">Power (white)</text>
  <text x="520" y="300" fill="#e8efe9" font-size="13" font-weight="700">GND</text>
  <text x="520" y="317" fill="#9fb0a4" font-size="12">Ground (bare)</text>

  <text x="30" y="345" fill="#9fb0a4" font-size="12">Set sdi12_data_pin to GPIO2. The round screen shows VWC, EC and dryback.</text>
</svg>
